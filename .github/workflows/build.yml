name: Build and audit
on:
  push:
    branches: [main]
  pull_request:
jobs:
  astro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build static HTML
        run: npm run build
      - name: Audit generated HTML
        run: npm run audit
      - name: Test Bubble CSV parser
        run: npm run test:import
      - name: Test legacy 301 redirect normalisation
        run: npm run test:redirects
      - name: Test imported historical 301 auditing
        run: npm run test:legacy
      - name: Audit imported historical 301 rules
        run: npm run audit:legacy
      - name: Validate source export ordering and URL preservation
        run: npm run audit:imports
      - name: Validate original blog content and image migration
        run: npm run audit:blog
      - name: Audit legacy sitemap coverage (advisory until cutover)
        run: npm run audit:migration
