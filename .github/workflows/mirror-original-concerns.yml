name: Mirror original 34 Bubble concern illustrations
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mirror-original-concerns.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install image converter
        run: npm install --no-save --no-package-lock --no-audit --no-fund sharp
      - name: Download original concern illustrations
        run: node scripts/mirror-original-concerns.mjs
        continue-on-error: true
      - name: Store media in Gorgeous2 repository
        run: |
          git config user.name "gorgeous2-reference-capture"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/concerns src/data/imported/original-concerns.json migration/reports/original-concern-images.json
          if git diff --cached --quiet; then
            echo "Nothing new to commit"
          else
            git commit -m "Self-host original 34 Bubble concern illustrations"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Report results
        run: cat migration/reports/original-concern-images.json
